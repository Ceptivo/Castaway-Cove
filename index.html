<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2B524C" />
    <link rel="icon" href="data:," />
    <title>Castaway Cove</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b524c;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      /* On wide screens (desktop, landscape) show the game at a portrait
         phone's shape in the middle; phones in portrait get the full screen. */
      @media (min-aspect-ratio: 3/4) {
        html,
        body {
          background: #1b3531;
        }
        #game {
          right: 0;
          left: 0;
          margin: 0 auto;
          width: calc(100vh * 360 / 780);
          box-shadow: 0 0 0 2px #211912, 0 12px 48px rgba(0, 0, 0, 0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
